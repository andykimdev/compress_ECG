[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compress-ecg"
version = "0.1.0"
description = "EchoNext data loading and model compression experiments"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn", "scipy", "torch>=2.6", "matplotlib", "psutil", "joblib"]

[project.optional-dependencies]
dev = ["pytest"]
onnx = ["onnx", "onnxruntime"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
